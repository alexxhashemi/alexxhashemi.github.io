<main id="main">
<h1>Request my CV</h1>
<p class="lead">My CV changes often, so rather than posting a copy that may be out of date, I send
the current version on request.</p>
<form class="cv-form" id="cvForm" action="https://formsubmit.co/alexxhashemi@gmail.com" method="POST">
  <input type="hidden" name="_subject" value="CV request from your website">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <label for="cvName">Name</label>
  <input id="cvName" name="name" type="text" autocomplete="name" required>
  <label for="cvEmail">Email</label>
  <input id="cvEmail" name="email" type="email" autocomplete="email" required>
  <label for="cvReason">Why do you need my CV?</label>
  <textarea id="cvReason" name="reason" rows="5" required placeholder="For example: a research collaboration, a conference, or a job opening"></textarea>
  <button type="submit">Send request</button>
  <p class="form-status" id="cvStatus" role="status" aria-live="polite"></p>
</form>
<p class="muted small">Your details are only used to reply to this request.</p>
</main>
<footer>&copy; 2026 Alex Hashemi</footer>
<script>
  (function () {
    var f = document.getElementById('cvForm'), st = document.getElementById('cvStatus');
    if (!window.fetch) return;
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = f.querySelector('button'); btn.disabled = true;
      st.className = 'form-status'; st.textContent = 'Sending...';
      fetch(f.action.replace('formsubmit.co/', 'formsubmit.co/ajax/'), {
        method: 'POST', headers: { 'Accept': 'application/json' }, body: new FormData(f)
      }).then(function (r) { return r.json().then(function (j) { if (!r.ok || j.success === 'false') throw j; }); })
        .then(function () {
          f.reset(); st.className = 'form-status ok';
          st.textContent = 'Thank you. Your request was sent, and I will email you my latest CV soon.';
        })
        .catch(function () {
          st.className = 'form-status err';
          st.textContent = 'Sorry, that did not go through. Please email me instead.';
        })
        .then(function () { btn.disabled = false; });
    });
  })();
</script>
<script>
  (function () {
    var root = document.documentElement, btn = document.getElementById('themeToggle');
    function sync() {
      var light = root.getAttribute('data-theme') === 'light';
      var label = light ? 'Switch to dark mode' : 'Switch to light mode';
      btn.setAttribute('aria-label', label); btn.setAttribute('title', label);
    }
    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
